<html lang="ar" dir="rtl">
<head>

<style>

*{box-sizing:border-box;margin:0;font-family:'Almarai','Tajawal','Segoe UI',Tahoma,Arial,sans-serif}
@keyframes bgFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

body{background:linear-gradient(135deg,var(--bg),var(--flow-b),var(--flow-c),var(--bg));background-size:300% 300%;animation:bgFlow 18s ease-in-out infinite;background-color:var(--bg);color:var(--tx);padding:15px;min-height:100vh;transition:background-color .3s,color .3s}

.top{display:flex;align-items:center;gap:16px}
.dashboard-banner{background:linear-gradient(120deg,#0B1F3F,#1B4079,#FF8A1F,#0B1F3F);background-size:300% 300%;animation:bgFlow 12s ease-in-out infinite;color:#fff;padding:15px 20px;border-radius:12px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}

.stats-box{display:flex;gap:15px;font-size:.85rem;background:rgba(255,255,255,.15);padding:8px 12px;border-radius:8px}

.task{flex-wrap:wrap}

.rb .q1{background:#FFF1D6;color:#9A5B00}.rb .q1 small{background:#FDD9B5}
.rb .q2{background:#E0F3E3;color:#0F6B2F}.rb .q2 small{background:#C3E8CB}
.rb .q3{background:#DCEBFF;color:#1D4ED8}.rb .q3 small{background:#C2DDFF}
body.dark-theme .rb .q0{background:rgba(255,120,110,.18);color:#FFB4AB}body.dark-theme .rb .q0 small{background:rgba(255,120,110,.28)}
body.dark-theme .rb .q1{background:rgba(255,177,77,.16);color:#FFD08A}body.dark-theme .rb .q1 small{background:rgba(255,177,77,.28)}
body.dark-theme .rb .q2{background:rgba(61,220,151,.16);color:#8FE8B8}body.dark-theme .rb .q2 small{background:rgba(61,220,151,.28)}

.rb button:hover{transform:translateY(-2px)}.rb button:active{transform:scale(.94)}
.rt{font-size:13px;white-space:nowrap}
.ub{border:1.5px solid var(--btn-bd);background:var(--btn-bg);color:var(--btn-tx);border-radius:6px;margin-inline-start:6px;cursor:pointer;padding:3px 8px}
.day{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.dd{width:56px;flex:none;text-align:center;background:var(--btn-bg);border:1px solid var(--bd);border-radius:8px;padding:8px 0}
.dd b{display:block;font-size:20px}.dd small{font-size:11px;color:var(--mut)}
.dd.today{background:linear-gradient(135deg,#12305E,#FF8A1F);color:#fff;border-color:transparent}.dd.today small{color:#fff}
.dl{flex:1;font-size:14px;line-height:1.9}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--or));transition:width .4s}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1;padding:10px 6px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;background:var(--btn-bg);color:var(--btn-tx);border:1.5px solid var(--btn-bd);transition:.15s}
.tabs button.on{background:var(--primary);color:var(--on);border-color:var(--primary);font-weight:700}
.empty{text-align:center;padding:20px 10px;color:var(--mut);font-size:.9rem;border:1.5px dashed var(--bd);border-radius:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum div{background:var(--btn-bg);border:1px solid var(--bd);border-radius:8px;padding:12px;text-align:center;font-size:14px}.sum b{display:block;font-size:22px;color:var(--acc)}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.pop,.fade{animation:pop .4s}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#12305E,#FF8A1F);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:98;box-shadow:0 10px 30px #0008;max-width:90%;text-align:center}
textarea{width:100%;min-height:110px;padding:10px;border-radius:6px;border:1.5px solid var(--btn-bd);background:var(--card);color:var(--tx);font-family:monospace;font-size:12px;direction:ltr;margin:10px 0}
#pa{display:none}
@media print{body{background:#fff!important;animation:none;padding:0;color:#000}.wrap,#toast{display:none!important}#pa{display:block;direction:rtl;color:#000}#pa section{page-break-after:always}#pa section:last-child{page-break-after:auto}#pa table{width:100%;border-collapse:collapse;font-size:12px}#pa th,#pa td{border:1px solid #999;padding:6px 8px;text-align:right;vertical-align:top;color:#000}#pa th{background:#12305E;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}#pa thead{display:table-header-group}#pa tr{page-break-inside:avoid}#pa h2{color:#12305E;font-size:20px;margin-bottom:4px}#pa p{margin-bottom:10px;font-size:12px;color:#333}.pf{font-size:11px;color:#777;margin-bottom:8px;direction:ltr}}
.chr{display:flex;align-items:center;gap:6px;margin-bottom:8px}.chr input{min-width:0}.mv{display:flex;flex-direction:column;gap:2px}.mv button{border:1px solid var(--btn-bd);background:var(--btn-bg);color:var(--btn-tx);border-radius:5px;font-size:10px;line-height:1;padding:3px 7px;cursor:pointer}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="pa"></div>
<input type="file" id="imf" hidden onchange="importFile(this)">
<script>
const $=s=>document.querySelector(s),app=$('#app');
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const QU=['التكرار هو أمّ الإتقان.','خطوة صغيرة كل يوم تصنع فرقًا كبيرًا.','ما تراجعه في الوقت المناسب يبقى معك.','الاستمرار أهم من الكمال.','اليوم تزرع، وغدًا تحصد.'];
let S={subs:[],tab:'today'},w=null,step=0,err='';
try{S=JSON.parse(localStorage.getItem('sr3')||'null')||S}catch(e){}
const save=()=>{try{localStorage.setItem('sr3',JSON.stringify(S))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>fmt(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseHard(t,N){const s=new Set();(t||'').split(/[,،\s]+/).forEach(x=>{const m=x.match(/^(\d+)(?:[-–](\d+))?$/);if(!m)return;let a=+m[1],b=+(m[2]||m[1]);for(let i=Math.min(a,b);i<=Math.max(a,b);i++)if(i>=1&&i<=N)s.add(i)});return [...s]}

const FQ=[.5,1.2,1.8,2.5];
const nextG=(g,f=1.8)=>f<1?Math.max(1,Math.round(g*f)):Math.max(g+1,Math.round(g*f));
function CUM(n){let g=0,c=0;const a=[];for(let j=1;j<=n;j++){g=j==1?1:nextG(g);c+=g;a.push(c)}return a}
const isRest=(s,d)=>s.restWd.includes(d.getDay())||s.restDates.includes(fmt(d));
const endOf=s=>addD(parse(s.start),s.days-1);
function place(s,d0,gap){
  let t=addD(d0,gap);const end=endOf(s);
  if(t>end)return null;
  while(isRest(s,t)&&t<=end)t=addD(t,1);
  if(t>end){t=addD(d0,gap);while(isRest(s,t)&&t>d0)t=addD(t,-1)}
  return isRest(s,t)||t<=d0?null:fmt(t);
}
const RR=(s,ch)=>ch.R??s.reps;
function project(s,ch,base,m,ng){
  let d=parse(base),gap=ng,dr=0;
  for(let j=m+1;j<=RR(s,ch);j++){
    const f=place(s,d,gap);
    if(!f){dr+=RR(s,ch)-j+1;break}
    s.tasks.push({cid:ch.id,date:f,type:'review',from:ch.from,to:ch.to,n:j,done:false,gap});
    d=parse(f);gap=nextG(gap);
  }
  return dr;
}
function build(c){
  const s={...c,tasks:[],chunks:[]},st=parse(c.start),avail=[];
  for(let i=0;i<c.days;i++){const d=addD(st,i);if(!isRest(s,d))avail.push(fmt(d))}
  if(!avail.length)return null;
  const hasHard=c.chs?c.chs.some(x=>x.h):c.hard.length>0,cum=CUM(c.reps+(hasHard&&c.reps>0?1:0)),lastOff=cum.length?cum[cum.length-1]:0;
  let span=Math.max(Math.ceil(c.days*.4),c.days-lastOff);
  if(c.reps>0&&c.days>1)span=Math.min(span,c.days-1);
  span=Math.max(1,span);
  let sd=avail.filter(d=>Math.round((parse(d)-st)/864e5)<span);
  if(!sd.length)sd=[avail[0]];
  const cmap=[];if(c.chs)c.chs.forEach((x,i)=>{for(let k=0;k<x.p;k++)cmap.push(i)});const isH=u=>c.chs?c.chs[cmap[u-1]].h:c.hard.includes(u);const SD=Math.min(sd.length,c.total),wt=u=>isH(u)?2:1;
  let W=0;for(let u=1;u<=c.total;u++)W+=wt(u);
  let remW=W;let u=1,dropped=0,id=0;
  for(let di=0;di<SD&&u<=c.total;di++){
    const from=u,last=di===SD-1,tg=remW/(SD-di);let acc=0;
    while(u<=c.total){if(!last&&acc>0&&acc+wt(u)/2>tg)break;acc+=wt(u);u++;if(!last&&c.total-u+1<=SD-di-1)break}
    remW-=acc;
    const ch={id:++id,from,to:u-1,w:0,m:0,ng:1,studied:false};
    for(let x=from;x<u;x++){ch.w+=wt(x);if(isH(x))ch.hc=true}ch.R=c.reps+(ch.hc&&c.reps>0?1:0);
    s.chunks.push(ch);
    s.tasks.push({cid:ch.id,date:sd[di],type:'study',from,to:u-1,done:false});
    dropped+=project(s,ch,sd[di],0,1);
  }
  return {s,tasks:s.tasks,studyDays:SD,avail:avail.length,dropped,base:cum};
}
let pp=false;
function nextAv(s,ds){let d=addD(parse(ds),1);while(s.restWd.includes(d.getDay())||s.restDates.includes(fmt(d)))d=addD(d,1);return fmt(d)}
function postpone(n){const td=today();S.subs.forEach(s=>{s.tasks.forEach(t=>{if(!t.done&&t.date>=td)for(let k=0;k<n;k++)t.date=nextAv(s,t.date)});s.days+=n});pp=false;save();render()}
function newW(){return {name:'',unit:'pages',nch:5,chs:Array.from({length:5},()=>({p:20,h:false})),total:100,hardTxt:'',days:30,reps:3,restWd:[5],restDates:[],start:today()}}
function editSub(id){
  const s=S.subs.find(x=>x.id===id),rem=Math.max(1,Math.round((endOf(s)-parse(today()))/864e5)+1);
  w={name:s.name,unit:s.unit,nch:s.chs?s.chs.length:5,chs:s.chs?s.chs.map(x=>({...x})):Array.from({length:5},()=>({p:20,h:false})),total:s.chs?100:s.total,hardTxt:s.chs?'':(s.hard||[]).join('، '),days:rem,rem,reps:s.reps,restWd:[...s.restWd],restDates:[...s.restDates],start:today(),editId:id};
  step=0;err='';SFX.tab();render();
}
function startWizard(){w=newW();step=0;err='';render()}

function cfgOf(){const ch=w.unit==='chapters',chs=ch?w.chs.map(x=>({p:Math.max(0,Math.round(+x.p||0)),h:!!x.h,n:(x.n||'').trim()})):null;return {unit:w.unit,chs,total:ch?chs.reduce((a,x)=>a+x.p,0):+w.total,days:+w.days,reps:+w.reps,restWd:w.restWd,restDates:w.restDates,start:w.start,hard:ch?[]:parseHard(w.hardTxt,+w.total)}}

function next(){
  err='';
  if(step===0&&!w.name.trim())err='اكتب اسم المادة أولًا';
  if(step===1){if(w.unit==='chapters'){if(!(w.nch>=1))err='أدخل عدد الفصول';else if(w.chs.some(x=>!(+x.p>=1)))err='أدخل عدد صفحات كل فصل (1 على الأقل)'}else if(!(+w.total>=1))err='أدخل عددًا صحيحًا'}
  if(step===2&&(!(+w.days>=1)||+w.reps<0))err='أدخل مدة صحيحة';
  if(step===3){const c=cfgOf();if(!build(c))err='كل الأيام راحة! أزل بعضها.'}
  if(err){render();return}
  if(step<4){step++;render();return}
  if(w.editId){
    const o=S.subs.find(x=>x.id===w.editId),c=cfgOf(),J=JSON.stringify,srt=a=>J([...a].sort()),pk=a=>J(a&&a.map(x=>[x.p,x.h]));
    const same=c.unit===o.unit&&c.total===o.total&&pk(c.chs)===pk(o.chs||null)&&J(c.hard)===J(o.hard||[])&&c.reps===o.reps&&srt(c.restWd)===srt(o.restWd)&&srt(c.restDates)===srt(o.restDates)&&c.days===w.rem;
    if(same){o.name=w.name.trim();if(o.chs)o.chs.forEach((x,i)=>x.n=c.chs[i].n)}
    else{const r=build(c);S.subs[S.subs.indexOf(o)]={...r.s,id:o.id,name:w.name.trim(),unit:w.unit,hist:{}}}
    S.tab='subs';w=null;SFX.add();save();render();return;
  }
  const c=cfgOf(),r=build(c);
  S.subs.push({...r.s,id:Date.now(),name:w.name.trim(),unit:w.unit,hist:{}});

function notifCard(){const n=S.nt||{},sup=native||'Notification' in window,pm=native?'granted':sup?Notification.permission:'denied',on=n.on&&pm==='granted';return `<div class="card"><h3 class="day-title">🔔 الإشعارات</h3><p class="s" style="margin-bottom:12px">تذكير يومي بمهامك في الوقت الذي تختاره. ${native?'يصلك التذكير في الوقت المحدد حتى لو كان التطبيق مغلقًا.':'يعمل والتطبيق مفتوح (حتى في الخلفية)، وإن فتحته بعد الوقت يصلك التذكير فورًا.'}</p>${!sup?'<p class="err" style="margin:0 0 10px">متصفحك لا يدعم الإشعارات.</p>':pm==='denied'?'<p class="err" style="margin:0 0 10px">الإشعارات محظورة لهذا الموقع من إعدادات المتصفح؛ فعّلها ثم أعد المحاولة.</p>':''}<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="chip ${on?'on':''}" onclick="toggleNotif()">${on?'🔔 مفعّلة':'🔕 تفعيل الإشعارات'}</button><label style="margin:0">الوقت</label><input type="time" value="${n.t||'08:00'}" onchange="setNT(this.value)" style="width:auto"><button class="chip" onclick="testNotif()">تجربة</button></div></div>`}
function printSubs(ids,dl){if(native)dl=true;
  const dn=d=>parse(d).toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const html=ids.map(id=>{const s=S.subs.find(x=>x.id===id);if(!s)return '';
    const dates=[...new Set(s.tasks.map(t=>t.date))].sort();
    return `<section><h2>${esc(s.name)}</h2><p>${s.chs?s.chs.length+' فصلًا ('+s.total+' صفحة)':s.total+' '+uw(s.unit,s.total)} • ${dates.length} يوم عمل • حتى ${dn(dates[dates.length-1])}</p><table><thead><tr><th>التاريخ</th><th>المهام</th><th>✓</th></tr></thead><tbody>${dates.map(d=>{const tk=s.tasks.filter(t=>t.date===d);return `<tr><td>${dn(d)}</td><td>${tk.map(t=>(t.type==='study'?'📖 دراسة':'🔁 مراجعة '+t.n)+': '+rng(t,s)).join('<br>')}</td><td>${tk.map(t=>t.done?'✔':'☐').join('<br>')}</td></tr>`}).join('')}</tbody></table></section>`}).join('');
  if(!html.trim()){toast('لا توجد مواد للطباعة');return}
  const css='body{font-family:Almarai,Tahoma,Arial,sans-serif;color:#000;margin:14px;direction:rtl}section{page-break-after:always}section:last-child{page-break-after:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #999;padding:6px 8px;text-align:right;vertical-align:top}th{background:#12305E;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}thead{display:table-header-group}tr{page-break-inside:avoid}h2{color:#12305E;margin:0 0 4px}p{font-size:12px;color:#333;margin:0 0 10px}.pf{font-size:11px;color:#777;direction:ltr;margin-bottom:8px}';
  const doc='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engram</title><style>'+css+'</style></head><body><div class="pf">Engram — Designed by Sameer Attar</div>'+html+'</body></html>';
  if(dl){saveBlob(doc,'engram-schedule-'+today()+'.html','text/html');toast('📄 تم إنشاء ملف الجدول — افتحه ثم اطبعه أو احفظه PDF');return}
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';f.srcdoc=doc;
  f.onload=()=>setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print();toast('🖨️ اختر «حفظ كـ PDF» لحفظ الجدول')}catch(e){printSubs(ids,true)}setTimeout(()=>f.remove(),120000)},300);
  document.body.appendChild(f);
}
function del(sid){if(dc!==sid){dc=sid;render();setTimeout(()=>{if(dc===sid){dc=null;render()}},3000);return}dc=null;SFX.del();S.subs=S.subs.filter(x=>x.id!==sid);save();render()}
function allTasks(){const a=[];S.subs.forEach(s=>s.tasks.forEach((t,i)=>a.push({s,t,i})));return a}
function taskHtml({s,t,i},late){
  const h=hardIn(s,t),rv=t.type==='review';
  const LB=['😵 نسيت','😓 بصعوبة','🙂 جيدًا','🤩 أتقنت'],B4=[['نسيت تمامًا','إعادة قريبة'],['تذكرت بصعوبة','زيادة بسيطة'],['تذكرت جيدًا','زيادة متوسطة'],['أتقنت الدرس','زيادة كبيرة']];
  const rb=t.done?`<div class="rt">${LB[t.rating]||''}<button class="ub" onclick="undo(${s.id},${i})">↩</button></div>`:
  `<div class="rq">${rv?'كيف كان تذكّرك للدرس؟':'كيف كانت دراستك للدرس؟'}</div><div class="rb">${B4.map((x,k)=>`<button class="q${k}" onclick="rate(${s.id},${i},${k})">${k+1}. ${x[0]}<small>${x[1]}</small></button>`).join('')}</div>`;
  return `<div class="task ${rv?'rev':''} ${t.done?'done':''} ${late?'late':''}"><div style="flex:1;min-width:0"><div class="t">${esc(s.name)}<span class="tag ${rv?'b':''}">${rv?'مراجعة '+t.n:'دراسة'}</span>${late?'<span class="tag r">متأخر</span>':''}</div>
  <div class="m">${rng(t,s)}${h.length?' • ⭐ صعب: '+h.join('، '):''}</div></div>${rb}</div>`;
}
function streak(){
  const a=allTasks(),by={};a.forEach(x=>{(by[x.t.date]=by[x.t.date]||[]).push(x.t)});
  let n=0,d=new Date();
  if(by[today()]&&by[today()].every(t=>t.done))n++;
  d=addD(d,-1);
  for(let g=0;g<400;g++){const k=fmt(d),v=by[k];if(v){if(v.every(t=>t.done))n++;else break}else if(!Object.keys(by).some(x=>x<k))break;d=addD(d,-1)}
  return n;
}
function todayView(){
  const a=allTasks(),td=today();
  const tt=a.filter(x=>x.t.date===td),late=a.filter(x=>x.t.date<td&&!x.t.done);
  const done=tt.filter(x=>x.t.done).length,pct=tt.length?Math.round(done/tt.length*100):0;
  const tot=a.filter(x=>x.t.done).length,all=a.length,R=46,C=2*Math.PI*R;
  const hr=new Date().getHours(),gr=hr<12?'صباح الخير ☀️':hr<18?'طاب يومك 🌤️':'مساء الخير 🌙';
  let h=`<div class="dashboard-banner"><div class="motivation-box"><div class="motivation-label">🔥 الحماسة اليومية</div><div class="mot">${QU[new Date().getDate()%QU.length]}</div><div class="today-motivation-sub">${tt.length?done+' من '+tt.length+' مهام اليوم':'لا مهام اليوم'}</div></div><div class="stats-box"><div>المنجزة: <b style="color:#FFD9A8">${tot}</b></div><div>الإتقان: <b style="color:#FFD9A8">${totalMastery()}%</b></div><div>السلسلة: <b style="color:#FFD9A8">${streak()}</b> 🔥</div></div></div><div class="card"><div class="top"><div class="ring"><svg width="110" height="110"><circle cx="55" cy="55" r="${R}" style="stroke:var(--bd)" stroke-width="10" fill="none"/><circle cx="55" cy="55" r="${R}" stroke="url(#g)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" style="transition:1s"/><defs><linearGradient id="g"><stop offset="0" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FFB04D"/></linearGradient></defs></svg><span>${pct}%</span></div>
  <div><h2>${gr}</h2><p class="s">${tt.length?`أنجزت ${done} من ${tt.length} مهام اليوم`:'لا توجد مهام مجدولة اليوم'}</p></div></div>
  <div class="bar" style="margin-top:16px"><i style="width:${totalMastery()}%"></i></div><p class="s" style="text-align:center;margin-top:4px">مستوى الإتقان الكلي ${totalMastery()}%</p></div>
  <div style="text-align:center;margin-bottom:14px"><button class="btn g sm" onclick="pp=!pp;render()">⏭️ إزاحة الجدول</button></div>
  ${pp?`<div class="card pop"><h3>أزِح كل المهام غير المنجزة من اليوم فصاعدًا</h3><p class="s">تُزاح كل الأيام التالية معًا مع الحفاظ على الفواصل بينها، وتتخطى أيام الاستراحة.</p><div class="chips" style="margin-top:12px">${[1,2,3,7].map(n=>`<button class="chip" onclick="postpone(${n})">${n===1?'يوم':n+' أيام'}</button>`).join('')}</div></div>`:''}`;
  if(late.length)h+=`<div class="card"><h3 class="day-title">⚠️ متأخرة (${late.length})</h3>`+late.map(x=>taskHtml(x,true)).join('')+'</div>';
  h+=`<div class="card"><h3 class="day-title">📌 مهام اليوم</h3>`;
  h+=tt.length?tt.map(x=>taskHtml(x)).join(''):`<div class="empty">🌴 يوم راحة أو لا مهام.<br>استمتع بوقتك!</div>`;
  h+='</div>';
  if(tt.length&&done===tt.length)h+=`<div class="card pop" style="text-align:center">🎉 أنجزت كل مهام اليوم — أحسنت!</div>`;
  return h;
}
function planView(){
  if(!S.subs.length)return '';
  const s=S.subs.find(x=>x.id===S.psub)||S.subs[0],td=today();
  const dates=[...new Set(s.tasks.map(t=>t.date))].sort();
  let h=`<div class="chips" style="margin-bottom:14px">${S.subs.map(x=>`<button class="chip ${x.id===s.id?'on':''}" onclick="S.psub=${x.id};save();render()">${esc(x.name)}</button>`).join('')}</div>`;
  const last=parse(dates[dates.length-1]);
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px"><h3 style="margin:0">🗓️ جدول ${esc(s.name)}</h3><button class="btn g sm" onclick="printSubs([${s.id}])">🖨️ PDF</button></div><p class="s" style="margin-bottom:14px">${dates.length} يوم عمل • حتى ${last.toLocaleDateString('ar',{day:'numeric',month:'long',year:'numeric'})}</p>`;
  dates.forEach(d=>{
    const dt=parse(d),tk=s.tasks.filter(t=>t.date===d),past=d<td;
    h+=`<div class="day" style="${past?'opacity:.55':''}"><div class="dd ${d===td?'today':''}"><small>${DN[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${dt.toLocaleDateString('ar',{month:'short'})}</small></div><div class="dl card" style="margin:0;padding:12px">`+
    tk.map(t=>`<div>${t.type==='study'?'📖':'🔁'} ${rng(t,s)}${t.type==='review'?' <span class="tag b">مراجعة '+t.n+'</span>':' <span class="tag">دراسة</span>'} ${t.done?'✅':(past?'⚠️':'')}</div>`).join('')+`</div></div>`});
  return h;
}
function subsView(){
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">📚 موادي</h3><button class="btn sm" onclick="startWizard()">＋ مادة جديدة</button></div>`;
  S.subs.forEach(s=>{const d=s.tasks.filter(t=>t.done).length,p=Math.round(d/s.tasks.length*100);
    h+=`<div class="card"><div style="display:flex;justify-content:space-between"><h2>${esc(s.name)}</h2><div style="display:flex;gap:6px"><button class="btn g sm" onclick="editSub(${s.id})">✏️</button><button class="btn g sm" onclick="del(${s.id})">${dc===s.id?'تأكيد الحذف؟':'🗑'}</button></div></div>
    <p class="s">${s.chs?s.chs.length+' فصلًا ('+s.total+' صفحة)':s.total+' '+uw(s.unit,s.total)} • ${s.days} يومًا • ${s.reps} تكرارات</p><p class="s" style="margin-top:8px">🏆 إتقان المادة: <b style="color:var(--acc)">${mastery(s)}%</b></p><div class="bar"><i style="width:${mastery(s)}%"></i></div>${spark(s)}<p class="s">${d} من ${s.tasks.length} مهمة مجدولة</p></div>`});
  return h+tools()+notifCard();
}
function render(){
  const head=`<header><div class="header-title-box"><h1>🧠 Engram</h1><div class="app-name-explainer">لماذا Engram؟ الأثر الذاكري (Engram) مصطلح يشير إلى التغيرات المادية المرتبطة بتكوين الذكريات في الدماغ، فكل مراجعة تساهم في ترسيخ هذا الأثر في الذاكرة طويلة الأمد 🧠</div><div class="designer-credit">Designed by Sameer Attar</div></div><div class="header-controls"><span class="dpill">${new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'})}</span><button class="btn-action" onclick="toggleTheme()">🌙 المظهر</button><button class="btn-action" onclick="snd=!snd;try{localStorage.setItem('sr3s',snd?'1':'0')}catch(e){};if(snd)SFX.tab();render()">${snd?'🔊':'🔇'} الصوت</button></div></header>`;
if(w||!S.subs.length){if(!w)w=newW();app.innerHTML=head+wizard();return}
  const v=S.tab==='today'?todayView():S.tab==='plan'?planView():subsView();
  app.innerHTML=head+`<div class="tabs">${[['today','🏠','اليوم'],['plan','🗓️','الجدول'],['subs','📚','موادي']].map(([k,i,n])=>`<button class="${S.tab===k?'on':''}" onclick="SFX.tab();S.tab='${k}';save();render()">${i} ${n}</button>`).join('')}</div><div class="fade">${v}</div>`;
}
let dark=(()=>{try{const v=localStorage.getItem('sr3t');if(v)return v==='d'}catch(e){}return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)})();
const applyTheme=()=>document.body.classList.toggle('dark-theme',dark);
function toggleTheme(){dark=!dark;try{localStorage.setItem('sr3t',dark?'d':'l')}catch(e){};applyTheme();SFX.tab()}
applyTheme();
let lastD=today();const chk=()=>{checkNotif();if(today()!==lastD){lastD=today();render()}};setInterval(chk,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
render();checkNotif();if(native)nativeSchedule();
</script>
