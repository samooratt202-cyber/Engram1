name: Build Engram APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Generate app icon
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets && cp icon.png assets/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0B1F3F' --iconBackgroundColorDark '#0B1F3F'
      - name: Add notification permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Engram-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
